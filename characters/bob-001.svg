<path d="M150,210 Q150,320 150,420" fill="none" stroke="#dcdad2" stroke-width="3" stroke-linecap="round"/>
<path d="M180,200 Q190,300 170,400" fill="none" stroke="#dcdad2" stroke-width="3" stroke-linecap="round"/>
</svg>
